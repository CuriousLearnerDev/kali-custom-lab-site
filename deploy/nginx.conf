server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 隐藏版本号
    server_tokens off;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP：站点全部资源自托管，可以收得很紧。
    # script-src 保留 'unsafe-inline'：Astro 会内联体积较小的客户端脚本
    #   （主题切换、灯箱），禁用内联会让这两个功能失效。
    #   其余指令保持严格：禁止外部脚本源、禁止内嵌框架、禁止 object/embed。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS：只有在 nginx 前面终止 TLS 时才生效；纯 HTTP 部署浏览器会忽略
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 旧地址 301 ----------
    # Astro 静态模式只能生成 meta refresh 的跳转页，这里用真 301 代替
    location = /products/i3/ {
        return 301 /products/i3wm/;
    }
    location = /products/kde-v4/ {
        return 301 /products/kde/;
    }
    location = /community/ {
        return 301 /about/;
    }

    # ---------- 缓存策略 ----------
    # 构建产物带内容哈希，可以永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 字体与图片（自托管，文件名不含哈希，缓存 30 天）
    location ~* ^/(fonts|shots|og)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML 走协商缓存，改版后立刻生效
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 真 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 不暴露隐藏文件
    location ~ /\. {
        deny all;
    }
}
